<body>
    <h1>쇼핑 특가 정보 자동화 블로그 3호점입니다.</h1>
    
    <!-- 🌟 추가됨: 사이트맵을 읽어와 화면에 뿌려주는 영역 및 스크립트 -->
    <div id="products-list">
        <p style="color: #666; margin-top: 20px;">최신 특가 상품을 불러오는 중입니다...</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 사이트맵 파일을 불러옵니다 (n8n이 갱신하는 파일)
            fetch('/sitemap.xml')
                .then(response => response.text())
                .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
                .then(data => {
                    const urls = data.querySelectorAll("url loc");
                    const listContainer = document.getElementById("products-list");
                    let html = "<ul style='line-height: 1.8; font-size: 16px; list-style-type: none; padding-left: 0; margin-top: 20px;'>";
                    
                    // 최신 글이 위로 오도록 배열을 뒤집음 (역순)
                    const urlArray = Array.from(urls).reverse();
                    
                    urlArray.forEach(urlNode => {
                        const loc = urlNode.textContent;
                        
                        // 메인 도메인 자체는 리스트에서 제외
                        if (loc === "https://shop3.torinori-shop.com" || loc === "https://shop3.torinori-shop.com/") return;
                        
                        // URL 경로에서 파일명(상품번호)만 추출하여 임시 제목으로 사용
                        let title = loc.split('/').pop().replace('.html', '').replace(/_/g, ' ');
                        if (!title) title = "특가 상품 확인하기";
                        
                        // 로봇이 타고 들어갈 수 있는 a 태그(하이퍼링크) 생성
                        html += `<li style="margin-bottom: 12px;">
                                    <a href="${loc}" style="color: #0056b3; text-decoration: none; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 2px;">
                                        👉 [특가 득템] ${title}
                                    </a>
                                 </li>`;
                    });
                    
                    html += "</ul>";
                    listContainer.innerHTML = html; // 화면에 생성된 링크 리스트 출력
                })
                .catch(err => {
                    console.error("Error loading sitemap:", err);
                    document.getElementById("products-list").innerHTML = "<p>상품 리스트 업데이트 중입니다...</p>";
                });
        });
    </script>
</body>
</html>
